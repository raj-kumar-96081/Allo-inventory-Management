version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: allo-postgres
    restart: always
    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: allo_inventory

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: allo-redis
    restart: always

    ports:
      - "6379:6379"

volumes:
  postgres_data: